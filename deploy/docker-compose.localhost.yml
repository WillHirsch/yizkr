# Overlay: run the whole stack on a single host with NO edits to the host's
# /etc/hosts. traefik routes by Host header, so the wiki and query service
# each need a resolvable name — but inside the Docker network traefik answers
# to both via network aliases, and a containerised `yizkr` CLI runs there and
# resolves them. Only a browser (outside Docker's DNS) still needs the names;
# see README.md ("Run on a single host") for the options.
#
#   docker compose -f docker-compose.yml -f docker-compose.localhost.yml up -d --wait
#   docker compose -f docker-compose.yml -f docker-compose.localhost.yml \
#       --profile cli run --rm yizkr smoke-test
#
# (or the make targets: `make up-local`, `make cli ARGS="smoke-test"`)

services:
  # traefik answers to the two public hostnames inside the Docker network,
  # so in-network clients reach it by name and it still routes by Host header.
  traefik:
    networks:
      default:
        aliases:
          - ${WIKIBASE_PUBLIC_HOST}
          - ${WDQS_PUBLIC_HOST}

  # The yizkr CLI, on the same network. `profiles` keeps it out of plain
  # `up`; invoke one-off commands with `run --rm`.
  yizkr:
    profiles: ["cli"]
    # Run as the host user so files the CLI writes into the ../var bind
    # mount are owned by you, not root. `make cli` / `make up-local` feed
    # UID/GID; a raw `docker compose run` should add --user (UID is a
    # readonly bash var, so it can't be set inline) or export UID/GID.
    # Falls back to root only if neither is provided.
    user: "${UID:-0}:${GID:-0}"
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # In-network, traefik always listens on 80. .env's HTTP_PORT is the
      # host-published port and must not leak into the CLI's derived URLs
      # (the concept URI is hostname-only, so it is unaffected either way).
      HTTP_PORT: "80"
      # The corpus and the never-ingest list live outside the repo (#29).
      # .env names them by host path; the container sees them read-only at
      # fixed paths (below), so the variables are rewritten to those paths,
      # or to empty when unset: `ingest run` then needs a folder argument,
      # and it refuses to run without a list.
      YIZKR_CORPUS_DIR: ${YIZKR_CORPUS_DIR:+/corpus}
      YIZKR_EXCLUDE_FILE: ${YIZKR_EXCLUDE_FILE:+/corpus-exclude.txt}
    volumes:
      # the generated static site lands on the host tree
      - ../var:/app/var
      # A set but wrong path stops `run` with an error instead of leaving
      # an empty root-owned folder where the list or corpus should be.
      # When unset, /dev/null stands in (the container variable is empty
      # then, so nothing reads it).
      - type: bind
        source: ${YIZKR_CORPUS_DIR:-/dev/null}
        target: /corpus
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${YIZKR_EXCLUDE_FILE:-/dev/null}
        target: /corpus-exclude.txt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - wikibase
      - wdqs
