# Wikibase Suite for the family-archive knowledge system (ADR-0001, ADR-0004 W1).
#
# Adapted from Wikibase Suite Deploy 7.0.0
# (https://github.com/wmde/wikibase-release-pipeline, deploy/docker-compose.yml).
# Local modifications:
#   - LAN/HTTP-first: URL scheme is ${PUBLIC_SCHEME} (default http) instead of
#     hard-coded https. Privacy-first archive; nothing public by default.
#     For public HTTPS exposure, layer docker-compose.https.yml on top.
#   - traefik runs without TLS/ACME in this base file.
#   - Host port configurable via ${HTTP_PORT} (default 80).
#
# See README.md in this directory for the deployment runbook.

name: yizkr-wikibase

services:
  # --------------------------------------------------
  # A. CORE WIKIBASE SUITE SERVICES
  # --------------------------------------------------

  wikibase:
    image: wikibase/wikibase:7
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./config:/config:z
      - ./config/extensions:/var/www/html/extensions/extensions:z
      - ./config/Extensions.php:/var/www/html/LocalSettings.d/90_UserDefinedExtensions.php:z
      - ./config/Uploads.php:/var/www/html/LocalSettings.d/91_Uploads.php:z
      - wikibase-image-data:/var/www/html/images
      - quickstatements-data:/quickstatements/data
    environment:
      # Keep in sync with the upstream deploy version this file was adapted from
      DEPLOY_VERSION: "7.0.0"
      METADATA_CALLBACK: ${METADATA_CALLBACK:-false}
      MW_ADMIN_NAME: ${MW_ADMIN_NAME}
      MW_ADMIN_PASS: ${MW_ADMIN_PASS}
      MW_ADMIN_EMAIL: ${MW_ADMIN_EMAIL}
      MW_WG_SERVER: ${PUBLIC_SCHEME:-http}://${WIKIBASE_PUBLIC_HOST}
      DB_SERVER: mysql:3306
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      ELASTICSEARCH_HOST: elasticsearch
      QUICKSTATEMENTS_PUBLIC_URL: ${PUBLIC_SCHEME:-http}://${WIKIBASE_PUBLIC_HOST}/tools/quickstatements
      WDQS_PUBLIC_ENDPOINT_URL: ${PUBLIC_SCHEME:-http}://${WDQS_PUBLIC_HOST}/sparql
      WDQS_PUBLIC_FRONTEND_URL: ${PUBLIC_SCHEME:-http}://${WDQS_PUBLIC_HOST}
    healthcheck:
      test: curl --silent --fail localhost/wiki/Main_Page
      interval: 10s
      start_period: 5m

  wikibase-jobrunner:
    image: wikibase/wikibase:7
    command: /jobrunner-entrypoint.sh
    depends_on:
      wikibase:
        condition: service_healthy
    restart: unless-stopped
    volumes_from:
      - wikibase

  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_RANDOM_ROOT_PASSWORD: yes
    healthcheck:
      test: healthcheck.sh --connect --innodb_initialized
      start_period: 1m
      interval: 20s
      timeout: 5s

  # --------------------------------------------------
  # B. EXTRA WIKIBASE SUITE SERVICES
  # --------------------------------------------------

  # To disable Elasticsearch and use default MediaWiki search functionality
  # remove the elasticsearch service and the ELASTICSEARCH_HOST var above.
  elasticsearch:
    image: wikibase/elasticsearch:1
    restart: unless-stopped
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m -Dlog4j2.formatMsgNoLookups=true
    healthcheck:
      test: curl --silent --fail localhost:9200
      interval: 10s
      start_period: 2m

  wdqs:
    image: wikibase/wdqs:2
    command: /runBlazegraph.sh
    depends_on:
      wikibase:
        condition: service_healthy
    restart: unless-stopped
    # Set number of files ulimit high enough, otherwise blazegraph will abort
    # with: library initialization failed - unable to allocate file descriptor
    # table - out of memory
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
    volumes:
      - wdqs-data:/wdqs/data
    healthcheck:
      test: curl --silent --fail localhost:9999/bigdata/namespace/wdq/sparql
      interval: 10s
      start_period: 2m

  wdqs-updater:
    image: wikibase/wdqs:2
    command: /runUpdate.sh
    depends_on:
      wdqs:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
    environment:
      # Baked into every triple as the entity URI prefix; changing it later
      # requires resetting WDQS (see README.md).
      WIKIBASE_CONCEPT_URI: ${PUBLIC_SCHEME:-http}://${WIKIBASE_PUBLIC_HOST}

  wdqs-frontend:
    image: wikibase/wdqs-frontend:2
    restart: unless-stopped
    volumes:
      - ./config:/config:z
    environment:
      WDQS_PUBLIC_URL: ${PUBLIC_SCHEME:-http}://${WDQS_PUBLIC_HOST}/sparql
      WIKIBASE_PUBLIC_URL: ${PUBLIC_SCHEME:-http}://${WIKIBASE_PUBLIC_HOST}/w/api.php
    healthcheck:
      test: curl --silent --fail localhost
      interval: 10s
      start_period: 2m

  quickstatements:
    image: wikibase/quickstatements:1
    depends_on:
      wikibase:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - quickstatements-data:/quickstatements/data
    environment:
      QUICKSTATEMENTS_PUBLIC_URL: ${PUBLIC_SCHEME:-http}://${WIKIBASE_PUBLIC_HOST}/tools/quickstatements
      WIKIBASE_PUBLIC_URL: ${PUBLIC_SCHEME:-http}://${WIKIBASE_PUBLIC_HOST}
    healthcheck:
      test: curl --silent --fail localhost
      interval: 10s
      start_period: 2m

  # --------------------------------------------------
  # C. REVERSE PROXY
  # --------------------------------------------------

  # Plain-HTTP reverse proxy for LAN deployment. For public HTTPS with
  # Let's Encrypt, add docker-compose.https.yml (see README.md).
  traefik:
    image: traefik:3
    command:
      - "--accesslog.format=common"
      - "--entrypoints.web.address=:80"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
    restart: unless-stopped
    ports:
      - ${HTTP_PORT:-80}:80
    volumes:
      - ./config/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    environment:
      WIKIBASE_PUBLIC_HOST: ${WIKIBASE_PUBLIC_HOST}
      WDQS_PUBLIC_HOST: ${WDQS_PUBLIC_HOST}

volumes:
  # A. CORE WIKIBASE SUITE SERVICES DATA
  wikibase-image-data:
  mysql-data:
  # B. EXTRA WIKIBASE SUITE SERVICES DATA
  wdqs-data:
  elasticsearch-data:
  quickstatements-data:
