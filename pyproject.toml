[project]
name = "yizkr"
version = "0.1.0"
description = "Family-archive knowledge system: Wikibase model bootstrap, ingestion pipeline, and query library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "wikibaseintegrator>=0.12,<0.13",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "requests>=2.31",
    "py3langid>=0.3.0",
]

[project.optional-dependencies]
# External LLM engine for transcription/extraction. Installing and
# configuring an API key is the explicit rule-7 opt-in: artifact content
# leaves the machine only through this extra.
llm = ["anthropic>=0.40"]
# Local face detection/recognition (ADR-0005). Heavy, but inference never
# leaves the machine.
faces = [
    "insightface>=0.7",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
]

[project.scripts]
yizkr = "yizkr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8",
    "ruff>=0.8",
    "pre-commit>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yizkr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests need the deploy/ stack running; opt in with `pytest -m live`
# (see Makefile: make test-live).
markers = [
    "live: requires a running Wikibase Suite stack and deploy/.env",
    "real_fsync: keep the real os.fsync, os.fdatasync and os.sync, which the unit tests otherwise skip (tests/unit/conftest.py)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
]
ignore = [
    "SIM108",   # ternary is not always clearer
]
