# Model manifest: core classes and properties for the family-archive
# knowledge graph (docs/MODELING.md, ADR-0003).
#
# Applied by model/bootstrap.py, which mints these as Wikibase entities
# in-instance, idempotently: entries are matched to existing entities by
# exact English label, so re-running never duplicates. Local P/Q ids are
# assigned by the instance at creation time and deliberately do NOT appear
# in this file (they differ between instances); the id mapping for a given
# instance is recorded on the wiki page named below.
#
# `wikidata` fields mirror Wikidata property/item *semantics* (see
# docs/MODELING.md). All mapped ids verified against wikidata.org.
# Wikibase assigns ids in creation order, so keep new entries at the END
# of their section for tidy numbering (not required for correctness).

version: 1

# Wiki page where bootstrap.py records the local id <-> Wikidata id mapping.
mapping_page: "Project:Model mapping"

# Item whose key is used as the `stated in` reference target for
# schema-level statements (e.g. the subclass hierarchy below), satisfying
# the reference requirement (ADR-0003): the manifest itself is the
# source asserting them.
schema_source_item: model_manifest

properties:
  instance_of:
    label: instance of
    description: class of which this entity is a particular example and member
    datatype: wikibase-item
    wikidata: P31

  subclass_of:
    label: subclass of
    description: all instances of this class are also instances of that class
    datatype: wikibase-item
    wikidata: P279

  part_of:
    label: part of
    description: this entity is a part of that entity; links an artifact fragment to its artifact
    datatype: wikibase-item
    wikidata: P361

  # --- provenance (ADR-0003 reference pattern) ---

  stated_in:
    label: stated in
    description: reference property; the artifact or artifact fragment that asserts the statement
    datatype: wikibase-item
    wikidata: P248

  inferred_from_extraction_run:
    label: inferred from extraction run
    description: reference property; the extraction run that produced this machine-written statement
    datatype: wikibase-item
    wikidata: P3452
    aliases:
      - inferred from

  page_number:
    label: page number
    description: locator qualifier; page(s) of the artifact the reference points into
    datatype: string
    wikidata: P304

  relative_position_within_image:
    label: relative position within image
    description: locator qualifier; region of an image as a percentage bounding box "x%,y%,w%,h%" measured from the top-left corner
    datatype: string
    wikidata: P2677
    aliases:
      - image region

  transcription_excerpt:
    label: transcription excerpt
    description: reference qualifier; short excerpt of the source text supporting human verification
    datatype: monolingualtext
    wikidata: P1683

  # --- names (typed and referenced; the item's aliases stay the flat,
  # unreferenced match index — see docs/MODELING.md "Names") ---

  birth_name:
    label: birth name
    description: >-
      full name a person was given at birth, as asserted by a source
      (a maiden name is a birth name); kept verbatim in the source's
      wording
    datatype: monolingualtext
    wikidata: P1477

  married_name:
    label: married name
    description: family name a person took on marriage, as asserted by a source
    datatype: monolingualtext
    wikidata: P2562

  nickname:
    label: nickname
    description: >-
      informal or familiar name a source uses for the person (a
      diminutive, a pet name, an "aka"); never their formal name
    datatype: monolingualtext
    wikidata: P1449

  official_name:
    label: official name
    description: >-
      a formally adopted or legally changed name, as asserted by a
      source (e.g. after a deed poll or naturalisation); date the
      change with start time / point in time qualifiers
    datatype: monolingualtext
    wikidata: P1448

  referred_to_as:
    label: referred to as
    description: >-
      a relational or perspectival appellation for the subject — a
      courtesy title, pet name, or term of address that is neither a
      formal name nor a derivable kinship term; recorded verbatim,
      qualified with `perspective` when the ego is known (ADR-0018)
    datatype: monolingualtext
    wikidata: P1810

  # --- persons and family relations ---

  date_of_birth:
    label: date of birth
    description: date on which the subject was born, as asserted by a source
    datatype: time
    wikidata: P569

  date_of_death:
    label: date of death
    description: date on which the subject died, as asserted by a source
    datatype: time
    wikidata: P570

  place_of_birth:
    label: place of birth
    description: place where the subject was born, as asserted by a source
    datatype: wikibase-item
    wikidata: P19

  place_of_death:
    label: place of death
    description: place where the subject died, as asserted by a source
    datatype: wikibase-item
    wikidata: P20

  age_at_death:
    label: age at death
    description: >-
      age at death exactly as asserted by a source (qualifier on date of
      death). Redundant with birth/death dates but still a source
      assertion; kept verbatim, never derived. No Wikidata equivalent.
    datatype: string

  said_to_be_the_same_as:
    label: said to be the same as
    description: >-
      this item and the object are said to be the same entity, per the
      cited sources — a contestable, source-attributed identity
      judgement (ADR-0007), used when a curator prefers a statement
      over an item merge
    datatype: wikibase-item
    wikidata: P460

  father:
    label: father
    description: male parent of the subject
    datatype: wikibase-item
    wikidata: P22

  mother:
    label: mother
    description: female parent of the subject
    datatype: wikibase-item
    wikidata: P25

  spouse:
    label: spouse
    description: the subject has the object as their spouse
    datatype: wikibase-item
    wikidata: P26

  child:
    label: child
    description: >-
      the subject has the object as a child (kinship primitive, ADR-0014);
      the inverse of father/mother, stored when a source frames the
      relation from the parent's side
    datatype: wikibase-item
    wikidata: P40

  relative:
    label: relative
    description: >-
      generic kinship fallback (ADR-0014): a source-asserted compound
      relation (aunt, cousin, in-law) that primitives cannot yet capture
      unambiguously; qualify with kinship type, verbatim
    datatype: wikibase-item
    wikidata: P1038

  kinship_type:
    label: kinship type
    description: >-
      qualifier on `relative`: the relationship exactly as a source
      words it ("maternal aunt", "cousin", "brother-in-law") — the
      frontend maps it to the derived-kinship term set (ADR-0014)
    datatype: string

  perspective:
    label: perspective
    description: >-
      qualifier on `referred_to_as`: the person or family from whose
      viewpoint the appellation applies (e.g. the grandchild who calls
      the subject "Oma") — ADR-0018. Optional; omit when the ego is not
      a modelled entity. Never mint an entity to fill it.
    datatype: wikibase-item

  sex_or_gender:
    label: sex or gender
    description: >-
      sex or gender of the person as asserted by a source; the
      prerequisite for the kinship calculus to derive gendered terms
      (aunt vs uncle, grandmother vs grandfather) — ADR-0014
    datatype: wikibase-item
    wikidata: P21

  residence:
    label: residence
    description: place where the person resided
    datatype: wikibase-item
    wikidata: P551

  sibling:
    label: sibling
    description: >-
      the subject has the object as a sibling, as asserted by a source —
      never derived from shared parents (a source asserting both
      parent relations has not asserted siblinghood)
    datatype: wikibase-item
    wikidata: P3373

  occupation:
    label: occupation
    description: >-
      occupation or profession of the person; values are occupation
      items whose labels keep the source's exact wording
    datatype: wikibase-item
    wikidata: P106

  employer:
    label: employer
    description: >-
      organization the person works or worked for, as asserted by a
      source; orthogonal to occupation (what they do vs whom they work
      for) — ADR-0012. Date with start/end time qualifiers
    datatype: wikibase-item
    wikidata: P108

  burial_place:
    label: place of burial
    description: place where the subject is buried, as asserted by a source
    datatype: wikibase-item
    wikidata: P119

  cause_of_death:
    label: cause of death
    description: >-
      cause of death exactly as the source words it, with its language.
      Wikidata models P509 with items; the archive keeps the verbatim
      prose of certificates and registers instead — never normalized
      or translated
    datatype: monolingualtext
    wikidata: P509

  number_of_children:
    label: number of children
    description: number of children of the person, as counted by a source
    datatype: quantity
    wikidata: P1971

  # --- person attributes & affiliations (ADR-0014) ---

  country_of_citizenship:
    label: country of citizenship
    description: the country (a place) whose citizen the subject is, as asserted by a source
    datatype: wikibase-item
    wikidata: P27

  religion:
    label: religion or worldview
    description: >-
      religion or denomination as a source words it, verbatim and in its
      language (never normalized) — mirrors the cause-of-death treatment
    datatype: monolingualtext
    wikidata: P140

  educated_at:
    label: educated at
    description: organization (school, college) the person was educated at, as asserted by a source
    datatype: wikibase-item
    wikidata: P69

  member_of:
    label: member of
    description: >-
      organization or family the person is or was a member of, as
      asserted by a source (ADR-0014 families / ADR-0018)
    datatype: wikibase-item
    wikidata: P463

  gave_refuge_to:
    label: gave refuge to
    description: >-
      the subject provided a home or refuge to the object person
      (ADR-0014); asymmetric hospitality — co-residence ("lived with")
      is instead derived from a shared residence
    datatype: wikibase-item

  # --- events ---

  participant:
    label: participant
    description: person or group that took part in the event
    datatype: wikibase-item
    wikidata: P710

  location:
    label: location
    description: place where the event or subject is located
    datatype: wikibase-item
    wikidata: P276

  point_in_time:
    label: point in time
    description: date something took place or existed
    datatype: time
    wikidata: P585

  start_time:
    label: start time
    description: time the subject began to exist or the statement started being valid
    datatype: time
    wikidata: P580

  end_time:
    label: end time
    description: time the subject ceased to exist or the statement stopped being valid
    datatype: time
    wikidata: P582

  time_period:
    label: time period
    description: named time period the subject occurred in; use instead of dates when the source speaks in periods
    datatype: wikibase-item
    wikidata: P2348

  # --- uncertainty (docs/MODELING.md, "Uncertainty and time") ---

  earliest_date:
    label: earliest date
    description: qualifier; earliest possible date for the statement's value, for ranges and vague sources
    datatype: time
    wikidata: P1319

  latest_date:
    label: latest date
    description: qualifier; latest possible date for the statement's value, for ranges and vague sources
    datatype: time
    wikidata: P1326

  sourcing_circumstances:
    label: sourcing circumstances
    description: qualifier for how a source states the value, e.g. circa; never narrow what a source says
    datatype: wikibase-item
    wikidata: P1480

  # --- depiction (ADR-0005) ---

  depicts:
    label: depicts
    description: person or thing depicted in the artifact; on photographs, qualified with relative position within image
    datatype: wikibase-item
    wikidata: P180

  image:
    label: image
    description: >-
      media (photo, scan, clipping) a source associates with the subject;
      value is a media item, possibly un-held — referenced from an export,
      bytes never fetched (ADR-0021). Looser than depicts, which is a
      confirmed depiction with an image region
    datatype: wikibase-item
    wikidata: P18

  # --- places ---

  coordinate_location:
    label: coordinate location
    description: geographic coordinates of the place
    datatype: globe-coordinate
    wikidata: P625

  geonames_id:
    label: GeoNames ID
    description: identifier for the place in the GeoNames gazetteer
    datatype: external-id
    wikidata: P1566

  whg_place_id:
    label: World Historical Gazetteer place ID
    description: identifier for the place in the World Historical Gazetteer
    datatype: external-id
    wikidata: P13061

  periodo_id:
    label: PeriodO period ID
    description: identifier for the period in the PeriodO time period gazetteer
    datatype: external-id
    wikidata: P9350

  # --- extraction runs (ADR-0003 process provenance) ---

  model_identifier:
    label: model identifier
    description: name and version of the machine-learning model used by an extraction or detection run
    datatype: string

  pipeline_version:
    label: pipeline version
    description: version of the extraction pipeline (prompt and code) that performed the run
    datatype: string
    wikidata: P348

  software_commit:
    label: software commit
    description: version-control commit hash of the pipeline software that performed the run
    datatype: string

  # --- artifacts as wiki media (ADR-0004 W1) ---

  media_file:
    label: media file
    description: title of the wiki file page (File:...) holding the digitised media of this artifact
    datatype: string

  media_sha1:
    label: media SHA-1
    description: >-
      SHA-1 content hash (hex) of the artifact's digitised media; the
      content-identity key that dedups re-uploads of the same bytes
      under different filenames (ADR-0010)
    datatype: string
    wikidata: P4092
    aliases:
      - checksum
      - content hash

  # --- open-schema harness (ADR-0013) ---

  type_hint:
    label: type hint
    description: >-
      free-text note of what an unclassified entity actually is
      ("company", "ship", "regiment"), recorded when no modelled kind
      fits — the input to the next vocabulary round, never a substitute
      for a real class
    datatype: string

# `entity_kind: true` marks an item the extractor may type a
# document-mentioned entity as (ADR-0007 manifest pass). The extraction
# prompt renders that set — and each kind's description — from here, so
# this file stays the single place the offerable kinds are declared.
# Artifact types, controlled-vocabulary values, and infrastructure
# classes are real classes but are not entity kinds.
items:
  # --- core classes (docs/MODELING.md) ---

  human:
    label: human
    description: person known to the archive
    aliases:
      - person
    wikidata: Q5
    entity_kind: true

  place:
    label: place
    description: geographic place, including historical places that no longer exist
    entity_kind: true

  organization:
    label: organization
    description: >-
      an organization acting as an agent — company, bank, committee,
      government body, school, or congregation (ADR-0012); distinct from
      place (it has a location, it is not one), typed by primary role
    aliases:
      - company
      - institution
    wikidata: Q43229
    entity_kind: true

  family:
    label: family
    description: >-
      a named family or household unit ("the Wulffs", "the Franklin
      family") — a collective of related people (ADR-0014); members
      attach via kinship or `member of`
    wikidata: Q8436
    entity_kind: true

  vessel:
    label: vessel
    description: a ship or boat, e.g. an emigration vessel (ADR-0014)
    aliases:
      - ship
    wikidata: Q11446
    entity_kind: true

  legal_instrument:
    label: legal instrument
    description: >-
      a law, decree, statute, gazette, or official register cited by a
      source (ADR-0014) — e.g. the Reichsabgabenordnung, Reichsgesetzblatt
    aliases:
      - law
      - statute
    wikidata: Q1298668
    entity_kind: true

  military_unit:
    label: military unit
    description: an organized military formation, e.g. a regiment or brigade (ADR-0014)
    wikidata: Q176799
    entity_kind: true

  time_period_class:
    label: time period
    description: named span of time, linked to PeriodO definitions where applicable

  event:
    label: event
    description: something that happened at a time, usually at a place, usually involving people
    entity_kind: true

  artifact:
    label: artifact
    description: digitised source document or object that asserts knowledge, e.g. a photograph or certificate

  artifact_fragment:
    label: artifact fragment
    description: page, crop, or region of an artifact that a reference can point into
    aliases:
      - fragment

  extraction_run:
    label: extraction run
    description: one execution of the ingestion pipeline; process-provenance target for machine-written statements

  occupation_class:
    label: occupation
    description: occupation or profession named by sources; the value class for the occupation property, with labels kept in the source's wording
    wikidata: Q12737077
    entity_kind: true

  unclassified_entity:
    label: unclassified entity
    description: >-
      open-schema holding class (ADR-0013): a real entity a source
      asserts exists but that no modelled kind can express yet, kept
      queryable (with a type hint) to drive vocabulary growth without
      mistyping it as a person or place
    entity_kind: true

  # --- event types (subclasses of event) ---

  birth:
    label: birth
    description: event of a person being born
    subclass_of: event
    entity_kind: true

  death:
    label: death
    description: event of a person dying
    subclass_of: event
    entity_kind: true

  marriage:
    label: marriage
    description: event of persons marrying
    subclass_of: event
    wikidata: Q8445
    entity_kind: true

  migration:
    label: migration
    description: event of a person or family relocating
    subclass_of: event
    entity_kind: true

  military_service:
    label: military service
    description: event or period of a person serving in a military force
    subclass_of: event
    entity_kind: true

  deportation:
    label: deportation
    description: >-
      event of a person being forcibly deported (ADR-0014); participant +
      destination (location) + date, e.g. deportation to a ghetto or camp
    subclass_of: event
    wikidata: Q2249676
    entity_kind: true

  imprisonment:
    label: imprisonment
    description: event or period of a person being imprisoned or detained (ADR-0014); participant + location + dates
    subclass_of: event
    entity_kind: true

  release:
    label: release
    description: event of a person being released from detention or imprisonment (ADR-0014)
    subclass_of: event
    entity_kind: true

  # --- artifact types (subclasses of artifact) ---

  photograph:
    label: photograph
    description: photographic artifact
    subclass_of: artifact
    wikidata: Q125191

  certificate:
    label: certificate
    description: official certificate artifact, e.g. birth, marriage, or death certificate
    subclass_of: artifact

  letter:
    label: letter
    description: written correspondence artifact
    subclass_of: artifact
    wikidata: Q133492

  census_page:
    label: census page
    description: page from a census return
    subclass_of: artifact

  newspaper_clipping:
    label: newspaper clipping
    description: clipping from a newspaper
    subclass_of: artifact

  presentation:
    label: presentation
    description: slide-deck artifact; a compound container whose slides are fragments and whose embedded media are derived artifacts (ADR-0008)
    subclass_of: artifact
    wikidata: Q604733

  genealogical_report:
    label: genealogical report
    description: structured genealogical report or database export, e.g. a GEDCOM family-tree export or a generated descendants report
    subclass_of: artifact

  address_book:
    label: address book
    description: address book or directory artifact listing people with addresses and contact details
    subclass_of: artifact
    wikidata: Q367035

  # --- controlled vocabulary values ---

  circa:
    label: circa
    description: sourcing circumstances value; the source gives the value as approximate
    wikidata: Q5727902

  male:
    label: male
    description: sex-or-gender value; the kinship calculus uses it for gendered terms (ADR-0014)
    wikidata: Q6581097

  female:
    label: female
    description: sex-or-gender value; the kinship calculus uses it for gendered terms (ADR-0014)
    wikidata: Q6581072

  # --- schema source (see schema_source_item above) ---

  model_manifest:
    label: model manifest
    description: model/manifest.yaml in the project repository; the document asserting schema-level statements such as the class hierarchy
