# Model manifest: core classes and properties for the family-archive
# knowledge graph (docs/MODELING.md, ADR-0003).
#
# Applied by model/bootstrap.py, which mints these as Wikibase entities
# in-instance, idempotently: entries are matched to existing entities by
# exact English label, so re-running never duplicates. Local P/Q ids are
# assigned by the instance at creation time and deliberately do NOT appear
# in this file (they differ between instances); the id mapping for a given
# instance is recorded on the wiki page named below.
#
# `wikidata` fields mirror Wikidata property/item *semantics* (see
# docs/MODELING.md). All mapped ids verified against wikidata.org.
# Wikibase assigns ids in creation order, so keep new entries at the END
# of their section for tidy numbering (not required for correctness).

version: 1

# Wiki page where bootstrap.py records the local id <-> Wikidata id mapping.
mapping_page: "Project:Model mapping"

# Item whose key is used as the `stated in` reference target for
# schema-level statements (e.g. the subclass hierarchy below), satisfying
# the reference requirement (ADR-0003): the manifest itself is the
# source asserting them.
schema_source_item: model_manifest

properties:
  instance_of:
    label: instance of
    description: class of which this entity is a particular example and member
    datatype: wikibase-item
    accepts: class
    wikidata: P31

  subclass_of:
    label: subclass of
    description: all instances of this class are also instances of that class
    datatype: wikibase-item
    accepts: class
    wikidata: P279

  part_of:
    label: part of
    description: >-
      this entity is a part of that entity; links an artifact fragment to
      its artifact, and a place to a container its source states, with the
      time the source gives (start_time, end_time or point_in_time) and
      none where it gives none
    datatype: wikibase-item
    accepts: [place, artifact, unclassified_entity]
    wikidata: P361

  # --- provenance (ADR-0003 reference pattern) ---

  stated_in:
    label: stated in
    description: reference property; the artifact or artifact fragment that asserts the statement
    datatype: wikibase-item
    reference: true
    accepts: [artifact, artifact_fragment]
    wikidata: P248

  inferred_from_extraction_run:
    label: inferred from extraction run
    description: reference property; the extraction run that produced this machine-written statement
    datatype: wikibase-item
    reference: true
    accepts: [extraction_run]
    wikidata: P3452
    aliases:
      - inferred from

  page_number:
    label: page number
    description: locator qualifier; page(s) of the artifact the reference points into
    datatype: string
    wikidata: P304

  relative_position_within_image:
    label: relative position within image
    description: locator qualifier; region of an image as a percentage bounding box "x%,y%,w%,h%" measured from the top-left corner
    datatype: string
    wikidata: P2677
    aliases:
      - image region

  transcription_excerpt:
    label: transcription excerpt
    description: reference qualifier; short excerpt of the source text supporting human verification
    datatype: monolingualtext
    wikidata: P1683

  printed_page_number:
    label: printed page number
    description: reference locator; the page number printed on the page the reference points into, exactly as printed, beside its physical page number
    datatype: string
    reference: true

  # --- names (typed and referenced; the item's aliases stay the flat,
  # unreferenced match index — see docs/MODELING.md "Names") ---

  birth_name:
    label: birth name
    description: >-
      full name a person was given at birth, as asserted by a source
      (a maiden name is a birth name); kept verbatim in the source's
      wording
    datatype: monolingualtext
    wikidata: P1477

  married_name:
    label: married name
    description: family name a person took on marriage, as asserted by a source
    datatype: monolingualtext
    wikidata: P2562

  nickname:
    label: nickname
    description: >-
      a name the source marks as what the person is called, by anyone
      ("Peppi", "Gustl"); never their formal name, and never what one
      person calls another or a name through a relation
      (`referred_to_as` alone)
    datatype: monolingualtext
    wikidata: P1449

  official_name:
    label: official name
    description: >-
      a formally adopted or legally changed name, as asserted by a
      source (e.g. after a deed poll or naturalisation); date the
      change with start time / point in time qualifiers
    datatype: monolingualtext
    wikidata: P1448

  referred_to_as:
    label: referred to as
    description: >-
      a form naming or addressing the person that is no plain name
      form: a kinship term with a name ("Tante Rahel") or alone
      ("Omama"), a pet name, a courtesy name ("Nana Maisie"); verbatim,
      with `perspective` when the ego is known (ADR-0018)
    datatype: monolingualtext
    wikidata: P1810

  name:
    label: name
    description: >-
      a name form a source gives a person without stating its type (birth,
      married, nickname or official), as the source writes it; never the
      person's label, and never a form the source types (ADR-0011)
    datatype: monolingualtext
    wikidata: P2561

  # --- persons and family relations ---

  date_of_birth:
    label: date of birth
    description: date on which the subject was born, as asserted by a source
    datatype: time
    wikidata: P569

  date_of_death:
    label: date of death
    description: date on which the subject died, as asserted by a source
    datatype: time
    wikidata: P570

  place_of_birth:
    label: place of birth
    description: place where the subject was born, as asserted by a source
    datatype: wikibase-item
    accepts: [place, unclassified_entity]
    wikidata: P19

  place_of_death:
    label: place of death
    description: place where the subject died, as asserted by a source
    datatype: wikibase-item
    accepts: [place, unclassified_entity]
    wikidata: P20

  age_at_death:
    label: age at death
    description: >-
      age at death exactly as asserted by a source (qualifier on date of
      death). Redundant with birth/death dates but still a source
      assertion; kept verbatim, never derived. No Wikidata equivalent.
    datatype: string

  said_to_be_the_same_as:
    label: said to be the same as
    description: >-
      this item and the object are said to be the same entity, per the
      cited sources — a contestable, source-attributed identity
      judgement (ADR-0007), used when a curator prefers a statement
      over an item merge
    datatype: wikibase-item
    accepts: subject
    wikidata: P460

  father:
    label: father
    description: male parent of the subject
    datatype: wikibase-item
    accepts: [human, unclassified_entity]
    wikidata: P22

  mother:
    label: mother
    description: female parent of the subject
    datatype: wikibase-item
    accepts: [human, unclassified_entity]
    wikidata: P25

  spouse:
    label: spouse
    description: >-
      retired (ADR-0036): a marriage is an entity whose couple take part
      in it with the role spouse, and the spouse link is derived from it
      by a query; this property takes no new claim
    datatype: wikibase-item
    wikidata: P26
    retired: true
    accepts: []

  child:
    label: child
    description: >-
      the subject has the object as a child (kinship primitive, ADR-0014);
      the inverse of father/mother, stored when a source frames the
      relation from the parent's side
    datatype: wikibase-item
    accepts: [human, unclassified_entity]
    wikidata: P40

  relative:
    label: relative
    description: >-
      generic kinship fallback (ADR-0014): a source-asserted compound
      relation (aunt, cousin, in-law) that primitives cannot yet capture
      unambiguously; qualify with kinship_type, verbatim, and with
      kinship_class, side, degree and removes (ADR-0035)
    datatype: wikibase-item
    accepts: [human, unclassified_entity]
    wikidata: P1038

  kinship_type:
    label: kinship type
    description: >-
      qualifier on `relative`: the relationship exactly as a source
      words it ("maternal aunt", "cousin", "brother-in-law") — the
      frontend maps it to the derived-kinship term set (ADR-0014)
    datatype: string

  perspective:
    label: perspective
    description: >-
      qualifier on `referred_to_as`: the person or family whose term it
      is (a grandchild who calls a grandmother "Omama"; a child who calls
      a non-relative "Nana Maisie"). Optional; omit when the ego is no
      modelled entity; never mint one.
    datatype: wikibase-item
    accepts: [human, family, unclassified_entity]

  sex_or_gender:
    label: sex or gender
    description: >-
      sex or gender of the person as asserted by a source; the
      prerequisite for the kinship calculus to derive gendered terms
      (aunt vs uncle, grandmother vs grandfather) — ADR-0014
    datatype: wikibase-item
    accepts: [male, female]
    wikidata: P21

  residence:
    label: residence
    description: place where the person resided
    datatype: wikibase-item
    accepts: [place, unclassified_entity]
    wikidata: P551

  sibling:
    label: sibling
    description: >-
      the subject has the object as a sibling, as asserted by a source —
      never derived from shared parents (a source asserting both
      parent relations has not asserted siblinghood)
    datatype: wikibase-item
    accepts: [human, unclassified_entity]
    wikidata: P3373

  occupation:
    label: occupation
    description: >-
      occupation or profession of the person; values are occupation
      items whose labels keep the source's exact wording
    datatype: wikibase-item
    accepts: [occupation_class, unclassified_entity]
    wikidata: P106

  employer:
    label: employer
    description: >-
      organization the person works or worked for, as asserted by a
      source; orthogonal to occupation (what they do vs whom they work
      for) — ADR-0012. Date with start/end time qualifiers
    datatype: wikibase-item
    accepts: [organization, unclassified_entity]
    wikidata: P108

  burial_place:
    label: place of burial
    description: place where the subject is buried, as asserted by a source
    datatype: wikibase-item
    accepts: [place, unclassified_entity]
    wikidata: P119

  cause_of_death:
    label: cause of death
    description: >-
      cause of death exactly as the source words it, with its language.
      Wikidata models P509 with items; the archive keeps the verbatim
      prose of certificates and registers instead — never normalized
      or translated
    datatype: monolingualtext
    wikidata: P509

  number_of_children:
    label: number of children
    description: number of children of the person, as counted by a source
    datatype: quantity
    wikidata: P1971

  # --- person attributes & affiliations (ADR-0014) ---

  country_of_citizenship:
    label: country of citizenship
    description: >-
      the country (a place) whose citizen the subject is, as asserted by
      a source; a country, never a town, city or region within one
    datatype: wikibase-item
    accepts: [place, unclassified_entity]
    wikidata: P27

  religion:
    label: religion or worldview
    description: >-
      religion or denomination as a source words it, verbatim and in its
      language (never normalized) — mirrors the cause-of-death treatment
    datatype: monolingualtext
    wikidata: P140

  educated_at:
    label: educated at
    description: organization (school, college) the person was educated at, as asserted by a source
    datatype: wikibase-item
    accepts: [organization, unclassified_entity]
    wikidata: P69

  member_of:
    label: member of
    description: >-
      organization or family the person is or was a member of, as
      asserted by a source (ADR-0014 families / ADR-0018)
    datatype: wikibase-item
    accepts: [organization, family, unclassified_entity]
    wikidata: P463

  gave_refuge_to:
    label: gave refuge to
    description: >-
      the subject provided a home or refuge to the object person
      (ADR-0014); asymmetric hospitality — co-residence ("lived with")
      is instead derived from a shared residence
    datatype: wikibase-item
    accepts: [human, unclassified_entity]

  # --- events ---

  participant:
    label: participant
    description: >-
      person or family that took part in the event, or one of the couple
      of a partnership or marriage; qualify with object_has_role to say
      how they took part
    datatype: wikibase-item
    accepts: [human, family, unclassified_entity]
    wikidata: P710

  location:
    label: location
    description: place where the event or subject is located
    datatype: wikibase-item
    accepts: [place, unclassified_entity]
    wikidata: P276

  point_in_time:
    label: point in time
    description: date something took place or existed
    datatype: time
    wikidata: P585

  start_time:
    label: start time
    description: time the subject began to exist or the statement started being valid
    datatype: time
    wikidata: P580

  end_time:
    label: end time
    description: time the subject ceased to exist or the statement stopped being valid
    datatype: time
    wikidata: P582

  time_period:
    label: time period
    description: named time period the subject occurred in; use instead of dates when the source speaks in periods
    datatype: wikibase-item
    accepts: [time_period_class]
    wikidata: P2348

  # --- uncertainty (docs/MODELING.md, "Uncertainty and time") ---

  earliest_date:
    label: earliest date
    description: >-
      qualifier; earliest possible date for the statement's date (its value
      or its point in time), for ranges and vague sources; on a statement
      with start or end time qualifiers (a residence, an employment, a
      containment), the earliest its start can be
    datatype: time
    wikidata: P1319

  latest_date:
    label: latest date
    description: >-
      qualifier; latest possible date for the statement's date (its value or
      its point in time), for ranges and vague sources; on a statement with
      start or end time qualifiers (a residence, an employment, a
      containment), the latest its end can be
    datatype: time
    wikidata: P1326

  sourcing_circumstances:
    label: sourcing circumstances
    description: qualifier for how a source states the value, e.g. circa; never narrow what a source says
    datatype: wikibase-item
    accepts: [circa]
    wikidata: P1480

  latest_start_date:
    label: latest start date
    description: >-
      qualifier; on a statement with start or end time qualifiers (a
      residence, an employment), the latest its start can be: with
      earliest_date, the range a source gives the start. Never on a
      start_time claim, which earliest_date and latest_date bound
    datatype: time
    wikidata: P8555

  earliest_end_date:
    label: earliest end date
    description: >-
      qualifier; on a statement with start or end time qualifiers (a
      residence, an employment), the earliest its end can be: with
      latest_date, the range a source gives the end. Never on an end_time
      claim, which earliest_date and latest_date bound
    datatype: time
    wikidata: P8554

  # --- depiction (ADR-0005) ---

  depicts:
    label: depicts
    description: person or thing depicted in the artifact; on photographs, qualified with relative position within image
    datatype: wikibase-item
    accepts: any
    wikidata: P180

  image:
    label: image
    description: >-
      media (photo, scan, clipping) a source associates with the subject;
      value is a media item, possibly un-held — referenced from an export,
      bytes never fetched (ADR-0021). Looser than depicts, which is a
      confirmed depiction with an image region
    datatype: wikibase-item
    accepts: [artifact]
    wikidata: P18

  # --- places ---

  coordinate_location:
    label: coordinate location
    description: geographic coordinates of the place
    datatype: globe-coordinate
    wikidata: P625

  geonames_id:
    label: GeoNames ID
    description: identifier for the place in the GeoNames gazetteer
    datatype: external-id
    wikidata: P1566

  whg_place_id:
    label: World Historical Gazetteer place ID
    description: identifier for the place in the World Historical Gazetteer
    datatype: external-id
    wikidata: P13061

  periodo_id:
    label: PeriodO period ID
    description: identifier for the period in the PeriodO time period gazetteer
    datatype: external-id
    wikidata: P9350

  # --- extraction runs (ADR-0003 process provenance) ---

  model_identifier:
    label: model identifier
    description: name and version of the machine-learning model used by an extraction or detection run
    datatype: string

  pipeline_version:
    label: pipeline version
    description: version of the extraction pipeline (prompt and code) that performed the run
    datatype: string
    wikidata: P348

  software_commit:
    label: software commit
    description: version-control commit hash of the pipeline software that performed the run
    datatype: string

  # --- artifacts as wiki media (ADR-0004 W1) ---

  media_file:
    label: media file
    description: title of the wiki file page (File:...) holding the digitised media of this artifact
    datatype: string

  media_sha1:
    label: media SHA-1
    description: >-
      SHA-1 content hash (hex) of the artifact's digitised media; the
      content-identity key that dedups re-uploads of the same bytes
      under different filenames (ADR-0010)
    datatype: string
    wikidata: P4092
    aliases:
      - checksum
      - content hash

  # --- open-schema harness (ADR-0013) ---

  type_hint:
    label: type hint
    description: >-
      free-text note of what an unclassified entity actually is
      ("company", "ship", "regiment"), recorded when no modelled kind
      fits — the input to the next vocabulary round, never a substitute
      for a real class
    datatype: string

  # --- claim structure (ADR-0035 §3) ---

  object_has_role:
    label: object has role
    description: >-
      qualifier on participant: how the person took part, as one of the
      participant role items (principal, parent, partner, spouse,
      informant, witness, officiant); one participant may hold several
      roles
    datatype: wikibase-item
    accepts: [principal, parent, partner, spouse, informant, witness, officiant]
    wikidata: P3831

  kinship_class:
    label: kinship class
    description: >-
      qualifier on relative: the class of the kinship term, as one of the
      kin_ items (kin_cousin for "cousin", kin_grandparent for "great
      grandmother"), beside its wording in kinship_type; kin_relative
      where the class is unclear
    datatype: wikibase-item
    accepts:
      - kin_parent
      - kin_child
      - kin_sibling
      - kin_grandparent
      - kin_grandchild
      - kin_aunt_or_uncle
      - kin_niece_or_nephew
      - kin_cousin
      - kin_parent_in_law
      - kin_child_in_law
      - kin_sibling_in_law
      - kin_relative

  side:
    label: kinship side
    description: >-
      qualifier on relative: paternal or maternal, only where the kinship
      term itself states the side ("uncle on the father's side"); never
      inferred
    datatype: wikibase-item
    accepts: [paternal, maternal]

  degree:
    label: kinship degree
    description: >-
      qualifier on relative: how many "great-"s the kinship term has
      (aunt 0, great-aunt 1), or a cousin's number (second cousin 2);
      only where the term states it
    datatype: quantity

  removes:
    label: removes
    description: >-
      qualifier on relative, for cousins only: how many times removed the
      term says the cousin is (second cousin once removed: 1); only where
      the term states it
    datatype: quantity

  # The subject is the source document itself, named by its content key
  # as a claim's source is, an artifact it places, or the artifact its
  # record makes or its text mentions (document_subject, ADR-0035 §3.4,
  # ADR-0039 §10).
  issued_by:
    label: issued by
    description: >-
      document -> the organization that issued it, such as the register
      office that issued a certificate
    datatype: wikibase-item
    accepts: [organization, unclassified_entity]
    wikidata: P2378
    document_subject: true

  carried_out_by:
    label: carried out by
    description: >-
      event -> the organization that carried it out, such as the court
      that pronounced a divorce; a person who performs an event is its
      participant with the role officiant instead
    datatype: wikibase-item
    accepts: [organization, unclassified_entity]

  civil_status:
    label: civil status
    description: >-
      a person's civil status as a source states it (unmarried: never
      married; married; widowed; divorced), dated as the source dates it;
      it names no partner and makes no marriage
    datatype: wikibase-item
    accepts: [unmarried, married, widowed, divorced]

  judgement:
    label: judgement
    description: >-
      reference property: the category of the extraction's judgement note
      on this statement, beside inferred from extraction run; the
      extraction's own remark, never the source's, and never used to rank
      or filter a value
    datatype: wikibase-item
    reference: true
    accepts:
      - judgement_kind
      - judgement_relation
      - judgement_date_reading
      - judgement_identity
      - judgement_other

  judgement_note:
    label: judgement note
    description: >-
      reference property: one sentence in English naming the judgement
      call the extraction made on this statement; the extraction's own
      remark, never the source's, and never used to rank or filter a
      value
    datatype: string
    reference: true

  # --- partnerships and marriages (ADR-0036) ---

  started_by:
    label: started by
    description: >-
      partnership or marriage -> the event that began it: its wedding,
      or a civil wedding or religious wedding where the source states
      the kind (each of two ceremonies, if it had both)
    datatype: wikibase-item
    accepts: [wedding, civil_wedding, religious_wedding, unclassified_entity]

  ended_by:
    label: ended by
    description: >-
      partnership or marriage -> the event that ended it: a divorce, an
      annulment, a partner's own death event, or an event of unstated
      kind
    datatype: wikibase-item
    accepts: [divorce, annulment, death, event, unclassified_entity]

  # --- scratch runs (ADR-0025 §1): statements of a run item, never of
  # an extracted entity, so no prompt offers them ---

  scratch_run:
    label: unratified scratch run
    description: >-
      on an extraction-run item: the development-stage scratch run that
      wrote it, by its run id. Nothing a scratch run writes is ratified,
      reviewed or confirmed, and the next reset discards it
    datatype: string
    offered: false

  run_manifest_hash:
    label: run manifest hash
    description: >-
      on an extraction-run item: the SHA-256 of the settings the run
      manifest of the run that wrote it records
    datatype: string
    offered: false

  identity_map_hash:
    label: identity map hash
    description: >-
      on an extraction-run item: the SHA-256 of the identity map the
      run's batch was written with
    datatype: string
    offered: false

  # --- what a source says an artifact is (itself, an artifact it places,
  # one its record makes or its text mentions), and a container's words
  # about what it places (ADR-0039) ---

  author:
    label: author
    description: >-
      document -> who wrote, drew or made it, as the document states of
      itself (a signature, a studio's stamp on a mount) or a source's
      passage conveys of a document it places or mentions
    datatype: wikibase-item
    accepts: [human, organization, family, unclassified_entity]
    wikidata: P50
    document_subject: true

  addressee:
    label: addressee
    description: >-
      document -> whom it was addressed to, as the document states of
      itself (a letter's greeting or address) or a source's passage
      conveys of a document it places or mentions
    datatype: wikibase-item
    accepts: [human, organization, family, unclassified_entity]
    wikidata: P1817
    document_subject: true

  inception:
    label: inception
    description: >-
      document -> when it was made, as the document states of itself (a
      letter's dateline) or a source's passage conveys of a document it
      places or mentions, at the precision it gives
    datatype: time
    wikidata: P571
    document_subject: true

  location_of_creation:
    label: location of creation
    description: >-
      document -> the place where it was made, as the document states of
      itself (a letter's heading) or a source's passage conveys of a
      document it places or mentions
    datatype: wikibase-item
    accepts: [place, unclassified_entity]
    wikidata: P1071
    document_subject: true

  main_subject:
    label: main subject
    description: >-
      document -> what it is about, as the document states of itself or a
      source's passage conveys of a document it places or mentions: a
      letter's topic, the district a map covers, the family a booklet is
      about; never whom an image shows (shows)
    datatype: wikibase-item
    accepts: any
    wikidata: P921
    document_subject: true

  shows:
    label: shows
    description: >-
      image -> who or what it shows, as its own content names them (an
      inscription on a print: one claim per name) or a source's passage
      conveys of an image it places or mentions; a source's words, never
      a confirmed depiction
    datatype: wikibase-item
    accepts: any
    document_subject: true

  caption:
    label: caption
    description: >-
      an artifact this document places (an image on its page or slide)
      -> this document's own words about it, verbatim: a caption, a
      heading over it, a sentence of commentary; the subject is that
      artifact, never the document
    datatype: monolingualtext
    wikidata: P2096
    placed_subject: true

  determination_method:
    label: determination method
    description: >-
      qualifier on a curator's statement: how its value was determined,
      such as combined from sources, where its references together give
      a value no one of them states (ADR-0039)
    datatype: wikibase-item
    accepts: [combined_from_sources]
    wikidata: P459
    offered: false

# `entity_kind: true` marks an item the extractor may type a
# document-mentioned entity as (ADR-0007 manifest pass). The extraction
# prompt renders that set — and each kind's description — from here, so
# this file stays the single place the offerable kinds are declared.
# Artifact types, controlled-vocabulary values, and infrastructure
# classes are real classes but are not entity kinds.
# `entity_class: true` marks every other class of entities (an artifact
# type, a time period, an infrastructure class). With the entity kinds,
# these are the kind keys: named by its key, such an item is the class
# itself, so only `instance_of` and `subclass_of` take it as a value
# (ADR-0035 §3.5). A controlled-vocabulary value is neither.
items:
  # --- core classes (docs/MODELING.md) ---

  human:
    label: human
    description: person known to the archive
    aliases:
      - person
    wikidata: Q5
    entity_kind: true

  place:
    label: place
    description: geographic place, including historical places that no longer exist
    entity_kind: true

  organization:
    label: organization
    description: >-
      an organization acting as an agent — company, bank, committee,
      government body, school, or congregation (ADR-0012); distinct from
      place (it has a location, it is not one), typed by primary role
    aliases:
      - company
      - institution
    wikidata: Q43229
    entity_kind: true

  family:
    label: family
    description: >-
      a named family or household unit ("the Löbigs", "the Lobig
      family") — a collective of related people (ADR-0014); members
      attach via kinship or `member of`
    wikidata: Q8436
    entity_kind: true

  vessel:
    label: vessel
    description: a ship or boat, e.g. an emigration vessel (ADR-0014)
    aliases:
      - ship
    wikidata: Q11446
    entity_kind: true

  legal_instrument:
    label: legal instrument
    description: >-
      a law, decree, statute, gazette, or official register cited by a
      source (ADR-0014) — e.g. a civil code or a law gazette
    aliases:
      - law
      - statute
    wikidata: Q1298668
    entity_kind: true

  military_unit:
    label: military unit
    description: an organized military formation, e.g. a regiment or brigade (ADR-0014)
    wikidata: Q176799
    entity_kind: true

  time_period_class:
    label: time period
    description: named span of time, linked to PeriodO definitions where applicable
    entity_class: true

  event:
    label: event
    description: something that happened at a time, usually at a place, usually involving people
    entity_kind: true

  artifact:
    label: artifact
    description: digitised source document or object that asserts knowledge, e.g. a photograph or certificate
    entity_class: true

  artifact_fragment:
    label: artifact fragment
    description: page, crop, or region of an artifact that a reference can point into
    aliases:
      - fragment
    entity_class: true

  extraction_run:
    label: extraction run
    description: one execution of the ingestion pipeline; process-provenance target for machine-written statements
    entity_class: true

  occupation_class:
    label: occupation
    description: occupation or profession named by sources; the value class for the occupation property, with labels kept in the source's wording
    wikidata: Q12737077
    entity_kind: true

  unclassified_entity:
    label: unclassified entity
    description: >-
      open-schema holding class (ADR-0013): a real entity a source
      asserts exists but that no modelled kind can express yet, kept
      queryable (with a type hint) to drive vocabulary growth without
      mistyping it as a person or place
    entity_kind: true

  partnership:
    label: partnership
    description: >-
      a couple's relationship, of any kind: two people a source presents
      as a couple without saying they married. The couple are its
      participants, with the role partner (ADR-0036)
    entity_kind: true

  marriage:
    label: marriage
    description: >-
      a marriage, as an entity and not an event: the couple are its
      participants, with the role spouse; started_by points to its
      wedding, ended_by to a divorce, an annulment or a death (ADR-0036)
    subclass_of: partnership
    wikidata: Q8445
    entity_kind: true

  # --- event types (subclasses of event) ---

  birth:
    label: birth
    description: event of a person being born
    subclass_of: event
    entity_kind: true

  death:
    label: death
    description: event of a person dying
    subclass_of: event
    entity_kind: true


  migration:
    label: migration
    description: event of a person or family relocating
    subclass_of: event
    entity_kind: true

  military_service:
    label: military service
    description: event or period of a person serving in a military force
    subclass_of: event
    entity_kind: true

  deportation:
    label: deportation
    description: >-
      event of a person being forcibly deported (ADR-0014); participant +
      destination (location) + date, e.g. deportation to a ghetto or camp
    subclass_of: event
    wikidata: Q2249676
    entity_kind: true

  imprisonment:
    label: imprisonment
    description: event or period of a person being imprisoned or detained (ADR-0014); participant + location + dates
    subclass_of: event
    entity_kind: true

  release:
    label: release
    description: event of a person being released from detention or imprisonment (ADR-0014)
    subclass_of: event
    entity_kind: true

  wedding:
    label: wedding
    description: >-
      event: the ceremony that starts a marriage, with its own date,
      place, witnesses and officiant; the couple take part in the
      marriage, not in the wedding (ADR-0036)
    subclass_of: event
    wikidata: Q49836
    entity_kind: true

  civil_wedding:
    label: civil wedding
    description: a wedding before a civil authority, such as a registrar, where the source states that kind (ADR-0036)
    subclass_of: wedding
    entity_kind: true

  religious_wedding:
    label: religious wedding
    description: a wedding in a religious ceremony, where the source states that kind (ADR-0036)
    subclass_of: wedding
    entity_kind: true

  divorce:
    label: divorce
    description: >-
      event: the end of a marriage that a court or another authority
      pronounces; carried_out_by names the authority (ADR-0036)
    subclass_of: event
    wikidata: Q93190
    entity_kind: true

  annulment:
    label: annulment
    description: >-
      event: a court's or another authority's declaration that a marriage
      is void, which ends it; carried_out_by names the authority
      (ADR-0036)
    subclass_of: event
    wikidata: Q701040
    entity_kind: true

  # --- artifact types (subclasses of artifact) ---

  photograph:
    label: photograph
    description: photographic artifact
    subclass_of: artifact
    wikidata: Q125191
    entity_class: true

  certificate:
    label: certificate
    description: official certificate artifact, e.g. birth, marriage, or death certificate
    subclass_of: artifact
    entity_class: true

  letter:
    label: letter
    description: written correspondence artifact
    subclass_of: artifact
    wikidata: Q133492
    entity_class: true

  census_page:
    label: census page
    description: page from a census return
    subclass_of: artifact
    entity_class: true

  newspaper_clipping:
    label: newspaper clipping
    description: clipping from a newspaper
    subclass_of: artifact
    entity_class: true

  presentation:
    label: presentation
    description: slide-deck artifact; a compound container whose slides are fragments and whose embedded media are derived artifacts (ADR-0008)
    subclass_of: artifact
    wikidata: Q604733
    entity_class: true

  genealogical_report:
    label: genealogical report
    description: structured genealogical report or database export, e.g. a GEDCOM family-tree export or a generated descendants report
    subclass_of: artifact
    entity_class: true

  address_book:
    label: address book
    description: address book or directory artifact listing people with addresses and contact details
    subclass_of: artifact
    wikidata: Q367035
    entity_class: true

  # --- controlled vocabulary values ---

  circa:
    label: circa
    description: sourcing circumstances value; the source gives the value as approximate
    wikidata: Q5727902

  male:
    label: male
    description: sex-or-gender value; the kinship calculus uses it for gendered terms (ADR-0014)
    wikidata: Q6581097

  female:
    label: female
    description: sex-or-gender value; the kinship calculus uses it for gendered terms (ADR-0014)
    wikidata: Q6581072

  # --- participant roles (object_has_role values, ADR-0035 §3.2) ---

  principal:
    label: principal
    description: >-
      participant role: the one an event happens to, such as the person
      born in a birth or who died in a death; a birth's or a death's date
      is its principal's alone
  parent:
    label: parent
    description: participant role; a parent of the principal, such as a parent named in a birth record
  partner:
    label: partner
    description: participant role; one of the couple of a partnership (ADR-0036)
  spouse:
    label: spouse
    description: participant role; one of the couple of a marriage (ADR-0036)
  informant:
    label: informant
    description: participant role; the person who reported the event to the record's keeper, such as the one who reported a birth or a death
  witness:
    label: witness
    description: participant role; a witness of the event that the source names
  officiant:
    label: officiant
    description: participant role; the person who performed the event, such as the registrar or cleric who conducted a wedding

  # --- kinship classes (kinship_class values, ADR-0035 §3.3) ---

  kin_parent:
    label: parent (kinship class)
    description: kinship class; a parent, for a literal term that reduces to no primitive
  kin_child:
    label: child (kinship class)
    description: kinship class; a child, for a literal term that reduces to no primitive
  kin_sibling:
    label: sibling (kinship class)
    description: kinship class; a sibling, for a literal term that reduces to no primitive
  kin_grandparent:
    label: grandparent
    description: kinship class; a grandparent, with each "great-" counted in degree
  kin_grandchild:
    label: grandchild
    description: kinship class; a grandchild, with each "great-" counted in degree
  kin_aunt_or_uncle:
    label: aunt or uncle
    description: kinship class; an aunt or an uncle, with each "great-" counted in degree
  kin_niece_or_nephew:
    label: niece or nephew
    description: kinship class; a niece or a nephew, with each "great-" counted in degree
  kin_cousin:
    label: cousin
    description: kinship class; a cousin, its number in degree and its removes in removes, where the term states them
  kin_parent_in_law:
    label: parent-in-law
    description: kinship class; a parent-in-law
  kin_child_in_law:
    label: child-in-law
    description: kinship class; a son-in-law or a daughter-in-law
  kin_sibling_in_law:
    label: sibling-in-law
    description: kinship class; a brother-in-law or a sister-in-law
  kin_relative:
    label: relative (kinship class)
    description: kinship class; a relative whose kind the term does not make clear

  # --- kinship sides (side values) ---

  paternal:
    label: paternal
    description: kinship side; on the father's side, where the term states it
  maternal:
    label: maternal
    description: kinship side; on the mother's side, where the term states it

  # --- civil statuses (civil_status values, ADR-0035 §3.1) ---

  unmarried:
    label: unmarried
    description: civil status; never married
  married:
    label: married
    description: civil status; married
  widowed:
    label: widowed
    description: civil status; widowed
  divorced:
    label: divorced
    description: civil status; divorced

  # --- judgement note categories (judgement values, ADR-0035 §4) ---

  judgement_kind:
    label: "judgement: kind"
    description: judgement note category; which kind an entity was typed as
  judgement_relation:
    label: "judgement: relation"
    description: judgement note category; which relation a statement was recorded as
  judgement_date_reading:
    label: "judgement: date reading"
    description: judgement note category; how a date was read
  judgement_identity:
    label: "judgement: identity"
    description: judgement note category; which entity a mention was read as
  judgement_other:
    label: "judgement: other"
    description: judgement note category; any other judgement call

  # --- determination methods (determination_method values, ADR-0039 §4) ---

  combined_from_sources:
    label: combined from sources
    description: determination method; a curator combined the values of the statement's references, none of which states the value alone

  # --- schema source (see schema_source_item above) ---

  model_manifest:
    label: model manifest
    description: model/manifest.yaml in the project repository; the document asserting schema-level statements such as the class hierarchy
