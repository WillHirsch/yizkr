name: CI

on:
  # every commit that lands on main
  push:
    branches: [main]
  # every push to a pull request, drafts included, tested with its base branch
  pull_request:
  # a run by hand on any branch
  workflow_dispatch:

# A newer push to a pull request cancels its run in progress; a run on
# main always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      prose_only: ${{ steps.scope.outputs.prose_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the tested change
        id: scope
        run: python3 scripts/ci_scope.py
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: make lint
      # pytest-xdist: one worker per CPU; loadfile keeps each test file in
      # one worker, so its module fixtures and test order hold as in a
      # serial run. Local runs stay serial unless -n is given.
      - name: Full offline suite
        if: steps.scope.outputs.prose_only != 'true'
        run: uv run pytest -n auto --dist loadfile --durations=20
      - name: Documentation consistency checks
        if: steps.scope.outputs.prose_only == 'true'
        run: >-
          uv run pytest -q
          tests/unit/test_anomalies.py::TestThresholds::test_the_defaults_are_one_documented_config
          tests/unit/test_engine_limits.py::TestOverageDocs
          tests/unit/test_engine_limits.py::TestUtilizationDocs
          tests/unit/test_engine_limits.py::TestUnifiedWindowsDocs
          tests/unit/test_engine_limits.py::TestPinDocs

  fictional-integration:
    # Spend database-runner minutes only after offline checks pass.
    needs: test
    if: needs.test.outputs.prose_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Required real writer/query checks
        run: make test-integration ARGS="--state /tmp/fictional-integration-evidence"
      - name: Recover interrupted fictional stack
        if: always()
        run: make integration-down ARGS="--state /tmp/fictional-integration-evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fictional-integration-evidence
          path: /tmp/fictional-integration-evidence/
