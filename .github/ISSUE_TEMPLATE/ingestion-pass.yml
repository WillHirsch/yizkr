name: Ingestion pass
description: A scoped corpus run or authorized retained admission. Local sessions only.
labels: ["kind:ingestion-pass", "exec:local-agent"]
body:
  - type: markdown
    attributes:
      value: >-
        Corpus work runs only in a local session (docs/AGENT_PROTOCOL.md
        sections 5–7). Rebuild runs use explicitly disposable targets and
        confer no human approval. Retained admission requires supported
        workflows and scoped authorization; filing this issue authorizes
        neither a keeper run nor a reset of retained data. Everything here
        is pseudonymous and aggregate. Detailed reports and diffs remain
        local-only; post only the aggregate report and diff summary.
  - type: dropdown
    id: kind
    attributes:
      label: Run mode
      options:
        - disposable rebuild or bounded corpus check
        - scratch-diff run for stated verification risk
        - retained admission, only when supported and authorized
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose and scope
      description: >-
        What the run must establish, which stages and sources it needs,
        and why bounded fictional or model checks are insufficient if a
        whole-corpus run is requested. Several related PRs may share a run.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target and authorization
      description: >-
        Identify the intended target without credentials or private paths.
        For write-side rebuilds, establish that it is disposable. For
        retained admission, link the owner authorization and supported
        review/recovery workflow. Never reset retained data.
    validations:
      required: true
  - type: input
    id: run-id
    attributes:
      label: Run id
      description: Fill in when the run starts.
  - type: input
    id: baseline
    attributes:
      label: Baseline run
      description: The comparison run and relevant configuration, or why no baseline applies. Reuse only compatible responses.
  - type: input
    id: prs
    attributes:
      label: PRs verified
      description: Issue or PR numbers covered by the run, if any.
  - type: textarea
    id: stages-run
    attributes:
      label: Stages and stop point
      description: Name the affected stages and necessary downstream work. Stop before writes when graph effects are irrelevant.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Tested revision
      description: Commit and configuration used; identify any local integration merge of related PRs.
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Aggregate counts; references only by QID or SHA-1 prefix plus a generic descriptor. No corpus quotations or identifying details.
  - type: checkboxes
    id: exclusion
    attributes:
      label: Exclusion check
      options:
        - label: An exclusion list is configured, and every source entering this run passes the shared exclusion check.
          required: true
  - type: textarea
    id: results
    attributes:
      label: Results and review
      description: >-
        Aggregate report, diff summary, relevant anomalies, reviewer and
        verdict. Attribute batched changes where possible; isolate a PR
        whose effect remains unclear. State the limitations of the evidence.
  - type: textarea
    id: problems
    attributes:
      label: Follow-up work
      description: >-
        Issues for observed problems. Correct pipeline regressions in code
        and regenerate affected outputs; do not conceal them by repairing
        the disposable graph. Retained corrections use supported, authorized
        curation workflows.
  - type: textarea
    id: retained-review
    attributes:
      label: Retained admission, if applicable
      description: >-
        Bounded proposals and identity assignments approved, remaining
        warnings, review record, and recovery/privacy checks. Approval to
        retain does not approve disclosure or face associations implicitly.
  - type: checkboxes
    id: no-real-data
    attributes:
      label: No real data
      options:
        - label: >-
            I re-read this text. It quotes, paraphrases or identifies
            nothing from the corpus.
          required: true
